{% extends "base_auth.html" %}
{% block title %}Reset · SOC{% endblock %}
{% block body %}
<p class="muted">Request a password reset. In development the token is returned in the response so you can complete the flow without email.</p>
<form id="forgot-form" class="mt-3">
  <label class="form-label">Email</label>
  <input class="form-control mb-3" type="email" name="email" required>
  <div id="auth-msg" class="small mb-3"></div>
  <button class="btn btn-cyan w-100" type="submit">Send reset token</button>
</form>
<p class="mt-3 small"><a class="link-info" href="/login">Back to sign in</a></p>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const res = await SOC.api('/api/auth/forgot-password', {
    method: 'POST',
    body: JSON.stringify({ email: fd.get('email') })
  });
  const data = await res.json();
  const el = document.getElementById('auth-msg');
  el.textContent = data.reset_token ? (data.message + ' Token: ' + data.reset_token) : data.message;
  if (data.reset_token) location.href = '/reset-password?token=' + encodeURIComponent(data.reset_token);
});
</script>
{% endblock %}
