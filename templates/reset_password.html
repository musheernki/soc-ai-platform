{% extends "base_auth.html" %}
{% block title %}New password · SOC{% endblock %}
{% block body %}
<form id="reset-form" class="mt-3">
  <label class="form-label">Reset token</label>
  <input class="form-control mb-3" name="token" id="token" required>
  <label class="form-label">New password</label>
  <input class="form-control mb-3" type="password" name="password" minlength="8" required>
  <div id="auth-msg" class="small mb-3"></div>
  <button class="btn btn-cyan w-100" type="submit">Update password</button>
</form>
{% endblock %}
{% block scripts %}
<script>
const params = new URLSearchParams(location.search);
if (params.get('token')) document.getElementById('token').value = params.get('token');
document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const res = await SOC.api('/api/auth/reset-password', {
    method: 'POST',
    body: JSON.stringify({ token: fd.get('token'), password: fd.get('password') })
  });
  const data = await res.json();
  document.getElementById('auth-msg').textContent = data.message || data.error;
  if (res.ok) location.href = '/login';
});
</script>
{% endblock %}
