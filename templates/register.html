{% extends "base_auth.html" %}
{% block title %}Register · SOC{% endblock %}
{% block body %}
<p class="muted">Register a standard user account. Admin roles are not self-assigned.</p>
<form id="reg-form" class="mt-3">
  <label class="form-label">Full name</label>
  <input class="form-control mb-3" name="name" required>
  <label class="form-label">Email</label>
  <input class="form-control mb-3" type="email" name="email" required>
  <label class="form-label">Password</label>
  <input class="form-control mb-3" type="password" name="password" minlength="8" required>
  <div id="auth-error" class="text-danger small mb-3"></div>
  <button class="btn btn-cyan w-100 py-2" type="submit">Create account</button>
</form>
<p class="mt-3 small"><a class="link-info" href="/login">Back to sign in</a></p>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('reg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const res = await SOC.api('/api/auth/register', {
    method: 'POST',
    body: JSON.stringify({ name: fd.get('name'), email: fd.get('email'), password: fd.get('password') })
  });
  const data = await res.json();
  if (!res.ok) {
    document.getElementById('auth-error').textContent = data.error || 'Registration failed';
    return;
  }
  location.href = '/login';
});
</script>
{% endblock %}
