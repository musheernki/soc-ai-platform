{% extends "base_app.html" %}
{% block crumb %}Command centre{% endblock %}
{% block heading %}Security dashboard{% endblock %}
{% block content %}
<div id="kpis" class="row g-3"></div>
<div class="row g-3 mt-1">
  <div class="col-lg-8"><div class="glass p-3"><canvas id="activityChart"></canvas></div></div>
  <div class="col-lg-4"><div class="glass p-3"><canvas id="severityChart"></canvas></div></div>
  <div class="col-lg-6"><div class="glass p-3"><canvas id="successFailChart"></canvas></div></div>
  <div class="col-lg-6"><div class="glass p-3"><canvas id="threatTrendChart"></canvas></div></div>
</div>
<div class="glass p-3 mt-3">
  <h5>Recent security events</h5>
  <div class="table-responsive"><table class="table table-sm" id="recent"></table></div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
